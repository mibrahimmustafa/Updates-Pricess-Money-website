# Deploy to Hostinger — تحديث تلقائي للاستضافة مع كل دخول إلى master
# ─────────────────────────────────────────────────────────────────────────
# ما إن تعمل `git push`، يرفع GitHub الشفرة تلقائياً FTP إلى Hostinger.
#
# الأسرار المطلوبة (Repository secrets):
#   FTP_SERVER    = المضيف بدون ftp://  (مثل ftp.u123456789.hostingersite.com)
#   FTP_USERNAME  = اسم مستخدم FTP
#   FTP_PASSWORD  = كلمة مرور FTP
#   FTP_PORT      = اختياري (21 افتراضياً)

name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch: {} # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true # رفع جديد يلغي أي رفع قديم متعثر

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # فحص الأسرار مسبقاً — فشل ودّي بإرشادات بدل خطأ غامض من الـaction
      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ]   && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "❌ Missing repository secrets:$missing"
            echo ""
            echo "أضفها من: GitHub_repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ All FTP secrets present"

      - name: Upload site files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          # مجلد جذر الموقع على Hostinger (عدّله إن كان نزل في مكان غلط):
          server-dir: ./
          # ملفات مستثناة من النشر (أدوات تطوير/توثيق فقط):
          exclude: |
            **/.git*
            **/.git*/**
            **/devserver.py
            **/README.md
            **/Pricess-Money-Web-Prompts-Html-Css-JS.md
            **/architecture.json
            **/arctecture.json
            **/.github/**
