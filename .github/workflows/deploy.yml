# Deploy to Hostinger — تحديث تلقائي للاستضافة مع كل دخول إلى master
# ─────────────────────────────────────────────────────────────────────────
# النقل عبر SFTP (مضمون موجود عند Hostinger) على بورت مخصص.
#
# الأسرار المطلوبة (Repository secrets):
#   FTP_SERVER    = المضيف بدون ftp://
#   FTP_USERNAME  = اسم مستخدم SFTP
#   FTP_PASSWORD  = كلمة مرور SFTP
#   FTP_PORT      = بورت SFTP من hPanel (مختلف عن 22 في الاستضافة الحالية)

name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch: {} # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true # رفع جديد يلغي أي رفع قديم متعثر

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # فحص الأسرار مسبقاً — فشل ودّي بإرشادات بدل خطأ غامض
      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ]   && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          [ -z "$FTP_PORT" ]     && missing="$missing FTP_PORT"
          if [ -n "$missing" ]; then
            echo "❌ Missing repository secrets:$missing"
            echo ""
            echo "أضفها من: GitHub_repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All secrets present"

      # تجريد ملفات التطوير/التوثيق من النسخة الراقلة للاستضافة
      - name: Strip dev-only files
        run: |
          rm -f devserver.py README.md architecture.json arctecture.json \
                Pricess-Money-Web-Prompts-Html-Css-JS.md
          rm -rf .github
          echo "stripped:"; ls

      - name: Upload site files (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}          # بورت SFTP المخصص
          ssh_private_key: ''                    # الدخول بكلمة المرور — المفتاح يُتجاهل
          password: ${{ secrets.FTP_PASSWORD }}  # إن وُجِد password يُستخدم بدل المفتاح
          local_path: './'
          remote_path: './'                      # جذر موقعك على الاستضافة — عدّله لو نزل الملفات في مكان غلط
          sftp_only: true                        # فرض وضع SFTP الصافي
          sftpArgs: '-o StrictHostKeyChecking=no -o ConnectTimeout=30'
