# Deploy to Hostinger — تحديث تلقائي للاستضافة مع كل دخول إلى master
# ─────────────────────────────────────────────────────────────────────
# النقل عبر SFTP بخطوة bash مباشرة (sshpass + sftp) مع إعادة محاولات
# تلقائية — لأن اتصال SFTP من GitHub Actions على بعض أنتيًا الـIP يتقطع
# (أثبت اليراقب: جولة #16 اتصلت وبدأت put، وجولة #17 خالف port timeout).

name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch: {} # زر تشغيل يدوي من تبويب Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true # رفع جديد يلغي أي رفع قديم متعثر

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # فحص الأسرار مسبقاً — فشل ودّي بإرشادات بدل خطأ غامض
      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ]   && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          [ -z "$FTP_PORT" ]     && missing="$missing FTP_PORT"
          if [ -n "$missing" ]; then
            echo "❌ Missing repository secrets:$missing"
            echo "أضِفها من: GitHub_repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All secrets present"

      # تجريد ملفات التطوير/التوثيق من النسخة الراقلة للاستضافة
      - name: Strip dev-only files
        run: |
          rm -f devserver.py README.md architecture.json arctecture.json \
                Pricess-Money-Web-Prompts-Html-Css-JS.md \
                TEST-REPORT.md REPAIR-PROMPT.md
          rm -rf .github
          # .git ضخم (حزم pack/objects) ووسطه ملفات تقتل sftp put -r
          rm -rf .git
          echo "stripped:"; ls -la

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # رفع عبر sftp مباشرة — 5 محاولات (كل محاولة runner ندي IP خاصية)
      - name: Upload site files (SFTP, retried)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -o pipefail
          printf 'put -r ./* .\nls -1\n' > /tmp/sftp_batch
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "── Attempt $attempt/5 ──"
            if sshpass -p "$FTP_PASSWORD" sftp \
                 -oBatchMode=no \
                 -oStrictHostKeyChecking=no \
                 -oUserKnownHostsFile=/dev/null \
                 -oConnectTimeout=45 \
                 -P "$FTP_PORT" \
                 "$FTP_USERNAME@$FTP_SERVER" < /tmp/sftp_batch; then
              ok=1
              echo "✅ Upload succeeded (attempt $attempt)"
              break
            fi
            echo "… attempt $attempt failed — sleeping 20s before retry"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "❌ All 5 sftp attempts failed — check server uptime/firewall for the SFTP port"
            exit 1
          fi
