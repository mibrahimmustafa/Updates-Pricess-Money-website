<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="45%" stop-color="#D4A548"/>
      <stop offset="100%" stop-color="#8A641F"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C368"/>
      <stop offset="100%" stop-color="#A87C2A"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221C10"/>
      <stop offset="100%" stop-color="#12100C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#goldRing)"/>
  <circle cx="256" cy="256" r="236" fill="url(#goldFace)"/>
  <circle cx="256" cy="256" r="228" fill="#141106"/>
  <circle cx="256" cy="256" r="204" fill="url(#inner)"/>
  <!-- شعاع: لمعة زاوية -->
  <path d="M52 256a204 204 0 0 1 204-204v140a64 64 0 0 0-64 64Z" fill="#FFF" opacity=".045"/>
  <!-- سراج ذهبي: شارة PM -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="170" fill="url(#goldFace)"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#F3DC9B" stroke-width="6" opacity=".7"/>
  </g>
  <!-- Monogram Pricess Money -->
  <text x="256" y="316" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800"
        font-size="168" letter-spacing="2" fill="#14100A">PM</text>
  <!-- خط زخرفي -->
  <path d="M136 352h240" stroke="#14100A" stroke-width="10" stroke-linecap="round" opacity=".25"/>
</svg>
