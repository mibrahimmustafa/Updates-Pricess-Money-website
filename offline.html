<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12100C">
  <title>أنت أوفلاين — Pricess Money</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #12100C; color: #F3EDE0;
      font-family: 'Cairo', system-ui, sans-serif; text-align: center; padding: 24px;
    }
    .logo { width: 84px; height: 84px; margin-inline: auto; filter: drop-shadow(0 8px 24px rgba(212,165,72,.35)); }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: #B8AE97; margin: 0 0 24px; line-height: 1.8; }
    a.btn {
      display: inline-flex; min-height: 48px; align-items: center; padding: 12px 28px;
      background: linear-gradient(135deg, #E8C368, #D4A548); color: #14100A;
      border-radius: 14px; text-decoration: none; font-weight: 800;
      box-shadow: 0 6px 24px rgba(212,165,72,.3);
    }
    .num { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div>
    <img class="logo" src="assets/logo.svg" alt="Pricess Money" width="84" height="84">
    <h1>أنت أوفلاين الآن</h1>
    <p>آخر الأسعار المتاحة كانت قد حُفظت —<br>المتّصل سيحديثها تلقائياً عند رجوع الشبكة.</p>
    <a class="btn rippled" href="./index.html#/home">أعِد المحاولة</a>
  </div>
</body>
</html>
